<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create product</title>
</head>
<body>
  <main>
    <h1>Create product</h1>
    {{if .Created}}
    <section aria-live="polite">
      <h2>Product created</h2>
      <p><strong>{{.Created.Identity.Name}}</strong> by {{.Created.Identity.Brand}} was created.</p>
      <p>Product ID: <code>{{.Created.Identity.ID}}</code></p>
    </section>
    {{end}}
    {{if .Errors}}
    <div role="alert">
      <h2>Could not create product</h2>
      <ul>
        {{range .Errors}}<li>{{.}}</li>{{end}}
      </ul>
    </div>
    {{end}}
    <form method="post" action="/products">
      <p>
        <label for="name">Name</label>
        <input id="name" name="name" value="{{.Name}}" required>
      </p>
      <p>
        <label for="brand">Brand</label>
        <input id="brand" name="brand" value="{{.Brand}}" required>
      </p>
      <p>
        <label for="amount">Package amount</label>
        <input id="amount" name="amount" value="{{.Amount}}" inputmode="decimal" required>
      </p>
      <p>
        <label for="unit">Unit</label>
        <select id="unit" name="unit" required>
          <option value="">Select a unit</option>
          {{range .Units}}<option value="{{.}}"{{if eq $.Unit .}} selected{{end}}>{{.}}</option>{{end}}
        </select>
      </p>
      <button type="submit">Create product</button>
    </form>
  </main>
</body>
</html>
